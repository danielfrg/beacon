<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beacon Logo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600&family=Space+Mono&display=swap" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <span class="eyebrow">Beacon · app icon</span>
        <h1>A toy lighthouse</h1>
        <p class="lede">Built from three.js shapes with a two-tone shader and a hard shadow cast onto the tile. Light is the cream tile; dark is the night tile.</p>
      </header>
      <section class="hero" id="hero"></section>
      <section style="display: grid; gap: 14px">
        <h2>Colourways</h2>
        <div class="grid" id="grid"></div>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
