name: Beacon
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 157.0.0
targets:
  Beacon:
    type: application
    platform: iOS
    sources: [Beacon]
    dependencies:
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Beacon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Beacon connects to your Frigate server on your local network."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: Beacon/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  BeaconTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BeaconTests
    dependencies:
      - target: Beacon
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.BeaconTests
  BeaconUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - BeaconUITests
    dependencies:
      - target: Beacon
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.BeaconUITests
        TEST_TARGET_NAME: Beacon
schemes:
  Beacon:
    build:
      targets:
        Beacon: all
        BeaconTests: [test]
    test:
      targets:
        - BeaconTests
  BeaconUI:
    build:
      targets:
        Beacon: all
        BeaconUITests: [test]
    test:
      targets:
        - BeaconUITests
